<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit book</title>
</head>
<body>
    <h1>Edit Book</h1>
    <form th:action="@{/update/{id}(id=${book.id})}" th:object="${book}" method="post">
        <label>Title:</label>
        <input type="text" th:field="*{title}" required/><br/>

        <label>Author:</label>
        <input type="text" th:field="*{author}" required/><br/>

        <label>Publication Year:</label>
        <input type="number" th:field="*{publicationYear}" required/><br/>

        <label>ISBN:</label>
        <input type="text" th:field="*{isbn}" required/><br/>

        <label>Price:</label>
        <input type="number" step="0.01" th:field="*{price}" required/><br/>

        <button type="submit"  style="margin-bottom: 10px; margin-top: 10px;">Save Changes</button>
    </form>
    <a href="/booklist"><button type="button">Back to List</button></a>
</body>
</html>
