<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <title>Add book</title>
</head>
<body>
    <div class="container">
        <h2>Add book</h2>
        <div class="col-md-4">
            <form th:object="${book}" th:action="@{save}" action="#" method="post">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control"/>
                <div style="clear: both; display: block; height: 10px;"></div>

                <label for="author">Author</label>
                <input type="text" id="author" th:field="*{author}" class="form-control"/>
                <div style="clear: both; display: block; height: 10px;"></div>

                <label for="publicationYear">Publication Year</label>
                <input type="text" id="pubyear" th:field="*{publicationYear}" class="form-control"/>
                <div style="clear: both; display: block; height: 10px;"></div>

                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" th:field="*{isbn}" class="form-control"/>
                <div style="clear: both; display: block; height: 10px;"></div>

                <label for="price">Price</label>
                <input type="text" id="price" th:field="*{price}" class="form-control"/>
                <div style="clear: both; display: block; height: 10px;"></div>

                <label for="categorylist">Category</label>
                <select th:field="*{category}" class="form-control" id="categorylist">
                    <option th:each="categ : ${categories}" th:value="${categ.categoryid}" th:text="${categ.name}"></option>
                </select>
                <div style="clear: both; display: block; height: 10px;"></div>

                <input type="submit" value="Save"></input>
            </form>

        </div>

    </div>
</body>
</html>
